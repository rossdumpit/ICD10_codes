name: build-windows-exe

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile ^
          --add-data "front.html;." ^
          --add-data "act_engaged.csv;." ^
          --add-data "existing_cause.csv;." ^
          --add-data "place_of_injury.csv;." ^
          run_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ICD10-exe
          path: dist/*
